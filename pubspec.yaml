name: zunghub
description: A marketplace and compliance hub for street vendors.
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_lints: ^5.0.0
  cupertino_icons: ^1.0.8
  firebase_core: ^3.8.0
  firebase_auth: ^5.3.3
  cloud_firestore: ^5.5.0
  firebase_storage: ^12.3.6
  flutter_riverpod: ^2.6.1
  go_router: ^14.6.2
  image_picker: ^1.1.2
  geolocator: ^13.0.2
  uuid: ^4.5.1
  firebase_messaging: ^15.2.10
  shared_preferences: ^2.3.2

flutter:
  uses-material-design: true
